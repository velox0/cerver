name: Nightly Build

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  nightly:
    name: Build & Publish Nightly
    runs-on: ubuntu-latest
    environment: NPM_PUBLISH

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run runtime tests
        run: make test-runtime

      - name: Run JS tests
        run: pnpm test

      - name: Bump version for nightly build
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH_NUM=${PATCH%%-*}
          NEXT_PATCH=$((PATCH_NUM + 1))
          DATE=$(date +%Y%m%d)
          NEW_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-nightly.${DATE}.${GITHUB_RUN_NUMBER:-0}"
          npm version "$NEW_VERSION" --no-git-tag-version
          echo "Bumped version from $VERSION to $NEW_VERSION"

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish nightly to npm
        run: npm publish --access public --provenance --tag nightly
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
